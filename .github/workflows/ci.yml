name: CI

on:
  push:
    branches: [main]
  pull_request:

# Một PR đẩy thêm commit thì huỷ lượt chạy cũ cho đỡ tốn phút.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    name: Typecheck, lint, unit test và build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      # Build chỉ cần biến môi trường hợp lệ về mặt hình thức: Next không gọi
      # Supabase lúc build vì mọi trang đều render theo yêu cầu.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: khoa-gia-cho-buoc-build

  test-database-va-e2e:
    name: pgTAP và Playwright trên Supabase local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Khởi động Supabase local
        run: supabase start

      - name: Test phân quyền database (pgTAP)
        run: supabase test db

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Test luồng người dùng (Playwright)
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          # Khoá anon của Supabase local luôn giống nhau trên mọi máy.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          CI: 'true'

      - name: Lưu báo cáo khi test hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
